openapi: 3.0.0
info:
  title: GREENHERB API Completa
  version: 1.0.0
  description: API central para gestão da estufa (Autenticação, Utilizadores, Planos, Lotes, Plantas, Tarefas, Alertas e Medições).

paths:

  /api/auth/registar:
    post:
      summary: Registar um novo utilizador
      tags: [Autenticação]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome, username, password, cargo]
              properties:
                nome: { type: string, example: "Maria Silva" }
                username: { type: string, example: "mariasilva" }
                password: { type: string, format: password }
                cargo: { type: string, enum: [Administrador, Técnico, Responsavel Tecnico] }
      responses:
        '201': { description: "Conta criada com sucesso" }
        '409': { description: "Username já registado" }

  /api/auth/login:
    post:
      summary: Autenticar no sistema (Login)
      tags: [Autenticação]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, example: "admin" }
                password: { type: string, format: password }
      responses:
        '200': { description: "Login efetuado com sucesso" }
        '401': { description: "Credenciais inválidas" }

  /api/utilizadores:
    get:
      summary: Listar todos os utilizadores
      tags: [Utilizadores]
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Utilizador' }

  /api/utilizadores/historico:
    get:
      summary: Ver histórico de auditoria/logs
      tags: [Utilizadores]
      parameters:
        - in: query
          name: utilizador
          schema: { type: string }
          description: Filtrar logs por utilizador
      responses:
        '200':
          description: Histórico obtido com sucesso
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Log' }

  /api/utilizadores/{id}/cargo:
    patch:
      summary: Alterar o cargo de um utilizador
      tags: [Utilizadores]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cargo]
              properties:
                cargo: { type: string, enum: [Administrador, Técnico, Responsavel Tecnico] }
      responses:
        '200': { description: "Cargo alterado com sucesso" }
        '400': { description: "Cargo inválido" }

  /api/utilizadores/{id}:
    delete:
      summary: Eliminar um utilizador
      tags: [Utilizadores]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: "Utilizador eliminado com sucesso" }
        '400': { description: "Não podes eliminar a tua própria conta" }


  /api/planos:
    get:
      summary: Listar todos os planos de cultivo
      tags: [Planos]
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Plano' }
    post:
      summary: Registar um novo Plano
      tags: [Planos]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome, ervaAromatica, tipo, automacao]
              properties:
                nome: { type: string, example: "Plano Inverno" }
                ervaAromatica: { type: string, example: "Manjericão" }
                tipo: { type: string, enum: [Regular, Emergência, Pontual] }
                automacao: { type: string, enum: [Manual, Automático] }
                regrasAutomacao: { type: string }
      responses:
        '201': { description: "Plano criado com sucesso" }
        '400': { description: "Faltam campos obrigatórios" }

  /api/planos/{id}/autorizar:
    patch:
      summary: Autorizar um plano Pontual
      tags: [Planos]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: "Plano autorizado com sucesso" }
        '404': { description: "Plano não encontrado" }


  /api/lotes:
    get:
      summary: Listar todos os lotes
      tags: [Lotes]
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Lote' }
    post:
      summary: Criar um novo lote
      tags: [Lotes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ervaAromatica, planoId, quantidadeInicial]
              properties:
                ervaAromatica: { type: string, example: "Hortelã" }
                planoId: { type: string, example: "PLN-001" }
                quantidadeInicial: { type: integer, example: 500 }
      responses:
        '201': { description: "Lote criado" }

  /api/lotes/exportar:
    get:
      summary: Exportar a lista de lotes num ficheiro CSV
      tags: [Lotes]
      responses:
        '200':
          description: Ficheiro CSV gerado com sucesso
          content:
            text/csv:
              schema:
                type: string
                format: binary

  /api/lotes/{id}/dividir:
    post:
      summary: Dividir um lote
      tags: [Lotes]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantidadeSeparar]
              properties:
                quantidadeSeparar: { type: integer, example: 100 }
      responses:
        '200': { description: "Lote dividido com sucesso" }

  /api/lotes/{id}/perdas:
    post:
      summary: Registar perdas num Lote
      tags: [Lotes]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantidadePerdida, motivo]
              properties:
                quantidadePerdida: { type: integer, example: 50 }
                motivo: { type: string, example: "Praga" }
      responses:
        '200': { description: "Perda registada" }


  /api/plantas:
    get:
      summary: Listar todas as plantas (ervas aromáticas)
      tags: [Plantas]
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Planta' }
    post:
      summary: Registar uma nova planta manualmente
      tags: [Plantas]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome]
              properties:
                nome: { type: string, example: "Manjericão" }
                especie: { type: string, example: "Ocimum basilicum" }
                tempMinima: { type: number, example: 15 }
                tempMaxima: { type: number, example: 28 }
                humidadeMinima: { type: number, example: 50 }
                humidadeMaxima: { type: number, example: 70 }
                cicloDeVida: { type: number, example: 60 }
                intervaloRega: { type: number, example: 2 }
      responses:
        '201': { description: "Planta registada com sucesso" }

  /api/plantas/importar:
    post:
      summary: Importar plantas através de ficheiro CSV
      tags: [Plantas]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                ficheiro:
                  type: string
                  format: binary
                  description: O ficheiro CSV com a lista de ervas aromáticas
      responses:
        '201': { description: "Ficheiro CSV importado e plantas guardadas" }

  /api/plantas/{id}:
    get:
      summary: Obter detalhes de uma planta específica
      tags: [Plantas]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Detalhes da planta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Planta' }
    put:
      summary: Atualizar uma planta existente
      tags: [Plantas]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Planta' }
      responses:
        '200': { description: "Planta atualizada com sucesso" }
    delete:
      summary: Eliminar uma planta
      tags: [Plantas]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: "Planta eliminada com sucesso" }

  /api/medicoes:
    get:
      summary: Listar histórico de medições
      tags: [Medições]
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Medicao' }
    post:
      summary: Registar nova medição (Temperatura, Humidade, Luz)
      tags: [Medições]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [loteId, temperatura, humidade, luminosidade]
              properties:
                loteId: { type: string, example: "L-001" }
                temperatura: { type: number, example: 22.5 }
                humidade: { type: number, example: 65 }
                luminosidade: { type: number, example: 300 }
      responses:
        '201': { description: "Medição registada com sucesso" }
        '400': { description: "Faltam dados da medição" }
        '404': { description: "Lote não encontrado" }

 
  /api/tarefas:
    get:
      summary: Listar todas as tarefas
      tags: [Tarefas]
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Tarefa' }
    post:
      summary: Registar nova tarefa
      tags: [Tarefas]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tipo, loteId, responsavel, prazoLimite]
              properties:
                tipo: { type: string, enum: [Rega, Fertilização, Colheita, Monitorização] }
                loteId: { type: string, example: "L-001" }
                responsavel: { type: string, example: "Maria Silva" }
                prazoLimite: { type: string, format: date-time }
      responses:
        '201': { description: "Tarefa criada com sucesso" }

  /api/tarefas/{id}/executar:
    patch:
      summary: Marcar tarefa como concluída
      tags: [Tarefas]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: "Tarefa executada com sucesso" }
        '404': { description: "Tarefa não encontrada" }


  /api/alertas:
    get:
      summary: Listar todos os alertas
      tags: [Alertas]
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Alerta' }

  /api/alertas/{id}/resolver:
    patch:
      summary: Resolver um alerta
      tags: [Alertas]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: "Alerta resolvido com sucesso" }

  /api/alertas/{id}/ignorar:
    patch:
      summary: Ignorar um alerta
      tags: [Alertas]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                justificacao: { type: string, example: "Leitura falsa do sensor." }
      responses:
        '200': { description: "Alerta ignorado" }


components:
  schemas:
    Utilizador:
      type: object
      properties:
        id: { type: string, example: "USR-001" }
        nome: { type: string, example: "Maria Silva" }
        username: { type: string, example: "mariasilva" }
        cargo: { type: string, enum: [Administrador, Técnico, Responsavel Tecnico] }
        dataRegisto: { type: string, format: date-time }

    Plano:
      type: object
      properties:
        id: { type: string, example: "PLN-001" }
        nome: { type: string }
        ervaAromatica: { type: string }
        tipo: { type: string, enum: [Regular, Emergência, Pontual] }
        automacao: { type: string, enum: [Manual, Automático] }
        estadoAutorizacao: { type: string, enum: [Aprovado, Pendente, Rejeitado] }
        regrasAutomacao: { type: string }
    
    Lote:
      type: object
      properties:
        id: { type: string, example: "L-001" }
        ervaAromatica: { type: string }
        planoId: { type: string }
        estado: { type: string, enum: [Ativo, Comprometido, Concluído] }
        quantidadeInicial: { type: integer }
        quantidadeAtual: { type: integer }
        dataInicio: { type: string, format: date-time }
        dataFim: { type: string, format: date-time, nullable: true }

    Tarefa:
      type: object
      properties:
        id: { type: string, example: "TAR-001" }
        tipo: { type: string, enum: [Rega, Fertilização, Colheita, Monitorização] }
        loteId: { type: string }
        estado: { type: string, enum: [Pendente, Concluída, Atrasada] }
        responsavel: { type: string }
        prazoLimite: { type: string, format: date-time }
        dataExecucao: { type: string, format: date-time, nullable: true }

    Alerta:
      type: object
      properties:
        id: { type: string, example: "ALT-001" }
        loteId: { type: string }
        gravidade: { type: string, enum: [Informativo, Aviso, Crítico] }
        descricao: { type: string }
        estado: { type: string, enum: [Pendente, Resolvido, Ignorado] }
        justificacao: { type: string, nullable: true }
        dataCriacao: { type: string, format: date-time }
      
    Planta:
      type: object
      properties:
        id: { type: string, example: "PLNT-001" }
        nome: { type: string, example: "Hortelã" }
        especie: { type: string, example: "Mentha spicata" }
        tempMinima: { type: number, example: 10 }
        tempMaxima: { type: number, example: 25 }
        humidadeMinima: { type: number, example: 60 }
        humidadeMaxima: { type: number, example: 80 }
        cicloDeVida: { type: number, example: 90 }
        intervaloRega: { type: number, example: 3 }
        
    Medicao:
      type: object
      properties:
        id: { type: string, example: "MED-001" }
        loteId: { type: string, example: "L-001" }
        temperatura: { type: number, example: 22.5 }
        humidade: { type: number, example: 65 }
        luminosidade: { type: number, example: 300 }
        dataRegisto: { type: string, format: date-time }

    Log:
      type: object
      properties:
        id: { type: string, example: "LOG-001" }
        utilizador: { type: string, example: "Maria Silva" }
        cargo: { type: string, example: "Técnico" }
        acao: { type: string, example: "Criou Planta" }
        detalhes: { type: string, example: "Nome: Hortelã | Espécie: Mentha spicata" }
        dataRegisto: { type: string, format: date-time }