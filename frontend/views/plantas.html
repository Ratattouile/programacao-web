<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard -GREENHERB</title>
    <link rel="stylesheet" href="/frontend/css/style.css">
    <script defer src="/frontend/js/plantas.js"></script>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=calendar_check,eco,logout,notifications,stacks,warning" />

</head>

<body class="app-layout">
    <header class="top-navbar">
        <div class="navbar-brand">
            <h2>🌱 GREENHERB</h2>
        </div>

        <nav class="navbar-nav">
            <ul>
                <li><a href="/frontend/views/home.html">Visão Geral</a></li>
                <li><a href="/frontend/views/lotes.html">Lotes de Cultivo</a></li>
                <li><a href="/frontend/views/plano.html">Planos de Cultivo</a></li>
                <li><a href="/frontend/views/tarefas.html">Tarefas</a></li>
                <!--<li><a href="/frontend/views/alertas.html">Alertas</a></li>-->
                <li><a href="/frontend/views/plantas.html" class="active">Plantas</a></li>
            </ul>
        </nav>

        <div class="navbar-user">
            <button class="alert-btn" aria-label="Alertas"
                onclick="window.location.href='/frontend/views/alertas.html'">
                <span class="material-symbols-outlined" style="font-size:18px">notifications</span>
                <div class="alert-dot"></div>
            </button>
            <div class="nav-avatar">JG</div>
            <span id="userDisplay">Bem-vindo</span>
            <button id="logoutBtn" class="logout-btn">
                <span class="material-symbols-outlined" style="font-size: 18px;">logout</span>
                <span class="tooltip">Terminar sessão</span>
            </button>
        </div>
    </header>
    <main class="main-content">
        <header class="topbar">
            <h1>Plantas</h1>
            <button id="btnNovaPlanta" class="btn-secondary" style="width:auto">+ Nova Planta</button>
        </header>

        <section class="content-area">
            <div class="card mt-2">
                <div class="section-title-row">
                    <h2>Todas as Plantas</h2>
                </div>
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Espécie</th>
                            <th>Temp. (°C)</th>
                            <th>Humidade (%)</th>
                            <th>Ciclo de Vida (dias)</th>
                            <th>Intervalo Rega (dias)</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaPlantas"></tbody>
                </table>
            </div>
        </section>
    </main>

    <div id="modalNovaPlanta" class="modal-overlay" style="display:none;">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title-group">
                    <div class="modal-icon">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                            <path d="M8 2v12M2 8h12" stroke="#a8e6a8" stroke-width="1.8" stroke-linecap="round" />
                        </svg>
                    </div>
                    <div>
                        <h2>Nova Planta</h2>
                        <p class="modal-subtitle">Regista uma nova erva aromática na estufa.</p>
                    </div>
                </div>
            </div>
            <div class="modal-divider"></div>
            <form id="formNovaPlanta">
                <div class="form-group">
                    <label>Nome</label>
                    <input type="text" id="plantaNome" placeholder="ex: Manjericão" required>
                </div>
                <div class="form-group">
                    <label>Espécie</label>
                    <input type="text" id="plantaEspecie" placeholder="ex: Ocimum basilicum" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Temp. Mínima (°C)</label>
                        <input type="number" id="plantaTempMin" placeholder="ex: 15" required>
                    </div>
                    <div class="form-group">
                        <label>Temp. Máxima (°C)</label>
                        <input type="number" id="plantaTempMax" placeholder="ex: 30" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Humidade Mínima (%)</label>
                        <input type="number" id="plantaHumMin" placeholder="ex: 40" required>
                    </div>
                    <div class="form-group">
                        <label>Humidade Máxima (%)</label>
                        <input type="number" id="plantaHumMax" placeholder="ex: 80" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Ciclo de Vida (dias)</label>
                        <input type="number" id="plantaCiclo" placeholder="ex: 90" required>
                    </div>
                    <div class="form-group">
                        <label>Intervalo Rega (dias)</label>
                        <input type="number" id="plantaRega" placeholder="ex: 2" required>
                    </div>
                </div>
                <div class="modal-divider"></div>
                <div class="actions-group">
                    <button type="button" id="btnFecharModalPlanta" class="btn-action ghost">Cancelar</button>
                    <button type="submit" class="btn-terceario">
                        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                            <path d="M2 7l4 4 6-7" stroke="#a8e6a8" stroke-width="1.8" stroke-linecap="round"
                                stroke-linejoin="round" />
                        </svg>
                        Criar planta
                    </button>
                </div>
            </form>
        </div>
    </div>
</body>

</html>
